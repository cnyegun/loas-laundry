name: Test

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: CLI starts and prints its version
        run: node src/loas-laundry.js --version

  install:
    name: install.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pack this commit the way npm installs it
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install it with install.sh into a scratch prefix
        env:
          LAUNDRY_PREFIX: ${{ runner.temp }}/laundry
        run: LAUNDRY_SOURCE="$(ls "$RUNNER_TEMP"/loas-laundry-*.tgz)" sh install.sh
      - run: ${{ runner.temp }}/laundry/bin/laundry --version

  # After a release tag is pushed, install it exactly the way users do, with git unavailable.
  released:
    name: Released install on ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      npm_config_git: /nonexistent/git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install with install.sh
        if: runner.os != 'Windows'
        env:
          LAUNDRY_PREFIX: ${{ runner.temp }}/laundry
        run: |
          sh install.sh
          test "$("$LAUNDRY_PREFIX/bin/laundry" --version)" = "${GITHUB_REF_NAME#v}"
      - name: Install with the README's Windows command
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g "https://codeload.github.com/cnyegun/loas-laundry/tar.gz/refs/tags/$GITHUB_REF_NAME"
          test "$(laundry --version)" = "${GITHUB_REF_NAME#v}"
