name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: CLI starts and prints its version
        run: node src/loas-laundry.js --version

  install:
    name: install.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack this commit the way npm installs it
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install it with install.sh into a scratch prefix
        env:
          LAUNDRY_PREFIX: ${{ runner.temp }}/laundry
        run: LAUNDRY_SOURCE="$(ls "$RUNNER_TEMP"/loas-laundry-*.tgz)" sh install.sh
      - run: ${{ runner.temp }}/laundry/bin/laundry --version
